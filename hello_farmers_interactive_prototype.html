<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HELLO FARMERS — Everything Farming. One App.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#14532D',
                        fresh: '#22C55E',
                        leaf: '#65A30D',
                        earth: '#F4E7CF',
                        gold: '#F59E0B',
                        offwhite: '#F8FAF7',
                        charcoal: '#17221B',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar and mobile frame styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F8FAF7;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #17221B;
        }
        .phone-frame {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 12px #1e293b;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center overflow-x-hidden selection:bg-fresh selection:text-white">

    <!-- Top Control Bar for Prototype Testing -->
    <header class="w-full bg-charcoal text-offwhite py-2 px-4 flex flex-wrap items-center justify-between border-b border-forest/40 text-xs sm:text-sm z-50">
        <div class="flex items-center space-x-3">
            <div class="flex items-center space-x-1.5 font-bold text-fresh">
                <i class="fa-solid fa-seedling"></i>
                <span class="tracking-wide">HELLO FARMERS</span>
            </div>
            <span class="hidden md:inline-block px-2 py-0.5 bg-forest/80 rounded-full text-[11px] text-earth font-medium">Cattle Management Module v1.0</span>
        </div>
        
        <!-- Screen Jump Navigator & Device Mode Switcher -->
        <div class="flex items-center space-x-2 my-1 sm:my-0">
            <label for="screenJump" class="text-xs text-earth/80 hidden sm:inline">Jump to:</label>
            <select id="screenJump" onchange="switchScreen(this.value)" class="bg-forest text-offwhite px-2.5 py-1 rounded-md text-xs border border-leaf focus:outline-none focus:ring-1 focus:ring-fresh">
                <option value="splash">1. Splash Screen</option>
                <option value="landing">2. Landing Page</option>
                <option value="signup">3. Sign Up</option>
                <option value="verify">4. Account Verification</option>
                <option value="onboarding">5. Farmer Onboarding</option>
                <option value="dashboard" selected>6. Livestock Dashboard</option>
                <option value="my_livestock">7. My Livestock</option>
                <option value="add_animal">8. Add Animal Flow</option>
                <option value="animal_profile">9. Animal Profile</option>
                <option value="health">10. Health Records</option>
                <option value="vaccination">11. Vaccination</option>
                <option value="treatment">12. Treatment</option>
                <option value="breeding">13. Breeding</option>
                <option value="milk">14. Milk Production</option>
                <option value="feed">15. Feed Management</option>
                <option value="expenses">16. Expenses</option>
                <option value="history">17. Complete History</option>
                <option value="notifications">18. Notifications</option>
                <option value="profile">19. Farmer Profile</option>
                <option value="settings">20. Settings</option>
            </select>

            <button onclick="toggleDeviceMode()" id="deviceToggleBtn" class="bg-leaf hover:bg-leaf/80 text-offwhite px-3 py-1 rounded-md font-medium text-xs transition flex items-center space-x-1">
                <i class="fa-solid fa-tablet-screen-button"></i>
                <span id="deviceToggleText">Tablet/Desktop View</span>
            </button>
            
            <button onclick="toggleOfflineMode()" id="offlineToggleBtn" class="bg-gold/90 hover:bg-gold text-charcoal px-2.5 py-1 rounded-md font-semibold text-xs transition flex items-center space-x-1" title="Simulate Offline/Online Sync State">
                <i class="fa-solid fa-wifi" id="wifiIcon"></i>
                <span id="wifiText">Online</span>
            </button>
        </div>
    </header>

    <!-- Main Application Container -->
    <main class="flex-1 w-full flex items-center justify-center p-0 sm:p-4 overflow-y-auto">
        
        <!-- Mobile Frame Wrapper -->
        <div id="appFrame" class="w-full sm:w-[412px] h-full sm:h-[845px] bg-offwhite flex flex-col relative sm:rounded-3xl phone-frame overflow-hidden transition-all duration-300">
            
            <!-- Offline Banner (Conditional) -->
            <div id="offlineBanner" class="hidden bg-amber-600 text-white text-xs py-1.5 px-3 flex items-center justify-between z-40">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="offlineMsg">Working offline. Changes will sync when connected.</span>
                </div>
                <button onclick="triggerSync()" class="underline font-bold text-[11px] hover:text-earth">Sync Now</button>
            </div>

            <!-- Dynamic Dynamic App Content Rendered Here -->
            <div id="screenContainer" class="flex-1 flex flex-col overflow-y-auto relative bg-offwhite">
                <!-- Screen content injected via JavaScript -->
            </div>

            <!-- Global Toast / Modal Container -->
            <div id="modalContainer" class="absolute inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4"></div>
            <div id="toastContainer" class="absolute bottom-16 left-4 right-4 z-50 flex flex-col items-center pointer-events-none"></div>

        </div>
    </main>

    <!-- Application Logic & State -->
    <script>
        // Global App State
        let currentScreen = 'dashboard';
        let isDeviceMobile = true; // true = mobile frame, false = expanded responsive view
        let isOffline = false;
        let onboardingStep = 1;
        let addAnimalStep = 1;
        
        // Mock User & Farm Data
        const state = {
            farmerName: "Juma Kiprono",
            farmName: "Green Valley Dairy Farm",
            country: "Kenya",
            county: "Uasin Gishu",
            farmingType: "Dairy",
            cattleCount: 24,
            animals: [
                { id: "HF-025", name: "Bella", breed: "Friesian", sex: "Female", age: "3 years", weight: "420 kg", status: "Healthy", purpose: "Milk & Breeding", milkToday: "18 L", lastCheck: "Today", photo: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=600&q=80" },
                { id: "HF-024", name: "Daisy", breed: "Ayrshire", sex: "Female", age: "4 years", weight: "390 kg", status: "Needs Attention", purpose: "Milk Production", milkToday: "14 L", lastCheck: "Yesterday", photo: "https://images.unsplash.com/photo-1570042225831-d98fa7577f1e?auto=format&fit=crop&w=600&q=80" },
                { id: "HF-021", name: "Simba", breed: "Boran", sex: "Male", age: "2.5 years", weight: "510 kg", status: "Healthy", purpose: "Breeding", milkToday: "0 L", lastCheck: "3 days ago", photo: "https://images.unsplash.com/photo-1527153857715-3908f2ae5e61?auto=format&fit=crop&w=600&q=80" },
                { id: "HF-018", name: "Luna", breed: "Jersey", sex: "Female", age: "5 years", weight: "350 kg", status: "Needs Attention", purpose: "Milk Production", milkToday: "12 L", lastCheck: "Today", photo: "https://images.unsplash.com/photo-1598425237682-4d0f779e51c8?auto=format&fit=crop&w=600&q=80" }
            ],
            selectedAnimalId: "HF-025",
            notifications: [
                { id: 1, type: "danger", title: "Vaccination due HF-025", desc: "FMD booster shot scheduled for 15 Oct", time: "Today", read: false },
                { id: 2, type: "warning", title: "Health follow-up HF-024", desc: "Check hoof rot treatment response tomorrow", time: "Yesterday", read: false },
                { id: 3, type: "warning", title: "Calving expected HF-018", desc: "Estimated delivery around 20 Oct", time: "3 days ago", read: true }
            ],
            expensesMonth: "KES 12,500",
            recentActivities: [
                { text: "Vaccination recorded Cow #HF-024", time: "Today, 10:30 AM", icon: "fa-syringe", color: "text-fresh" },
                { text: "Milk production updated Cow #HF-025", time: "Today, 07:15 AM", icon: "fa-glass-water", color: "text-leaf" },
                { text: "New animal added Bull #HF-025", time: "Yesterday", icon: "fa-circle-plus", color: "text-forest" }
            ]
        };

        // Navigation Controller
        function switchScreen(screenName) {
            currentScreen = screenName;
            document.getElementById('screenJump').value = screenName;
            renderScreen();
            
            // Scroll to top of container
            const container = document.getElementById('screenContainer');
            if(container) container.scrollTop = 0;
        }

        // Toggle Device View
        function toggleDeviceMode() {
            isDeviceMobile = !isDeviceMobile;
            const frame = document.getElementById('appFrame');
            const btnText = document.getElementById('deviceToggleText');
            
            if (!isDeviceMobile) {
                frame.classList.remove('sm:w-[412px]', 'sm:h-[845px]', 'sm:rounded-3xl', 'phone-frame');
                frame.classList.add('w-full', 'h-full', 'rounded-none');
                btnText.innerText = "Mobile View Frame";
            } else {
                frame.classList.add('sm:w-[412px]', 'sm:h-[845px]', 'sm:rounded-3xl', 'phone-frame');
                frame.classList.remove('w-full', 'h-full', 'rounded-none');
                btnText.innerText = "Tablet/Desktop View";
            }
        }

        // Toggle Offline Simulation
        function toggleOfflineMode() {
            isOffline = !isOffline;
            const banner = document.getElementById('offlineBanner');
            const wifiIcon = document.getElementById('wifiIcon');
            const wifiText = document.getElementById('wifiText');
            
            if(isOffline) {
                banner.classList.remove('hidden');
                wifiIcon.className = "fa-solid fa-triangle-exclamation text-charcoal";
                wifiText.innerText = "Offline Mode";
                showToast("Switched to offline mode. Data stored locally.", "warning");
            } else {
                banner.classList.add('hidden');
                wifiIcon.className = "fa-solid fa-wifi";
                wifiText.innerText = "Online";
                showToast("Back online. Synchronized successfully!", "success");
            }
        }

        function triggerSync() {
            showToast("Synchronizing 3 records with cloud...", "info");
            setTimeout(() => {
                showToast("All records successfully synchronized!", "success");
            }, 1200);
        }

        // Toast Notification Helper
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            let bgClass = 'bg-forest text-offwhite';
            let icon = 'fa-circle-check';
            if(type === 'warning') { bgClass = 'bg-gold text-charcoal'; icon = 'fa-triangle-exclamation'; }
            if(type === 'info') { bgClass = 'bg-leaf text-offwhite'; icon = 'fa-circle-info'; }
            
            toast.className = `${bgClass} text-xs py-2.5 px-4 rounded-xl shadow-lg flex items-center space-x-2 my-1 pointer-events-auto animate-fade-in font-medium`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Main Render Engine
        function renderScreen() {
            const container = document.getElementById('screenContainer');
            let html = '';

            switch(currentScreen) {
                case 'splash':
                    html = renderSplashScreen();
                    break;
                case 'landing':
                    html = renderLandingPage();
                    break;
                case 'signup':
                    html = renderSignUpScreen();
                    break;
                case 'verify':
                    html = renderVerifyScreen();
                    break;
                case 'onboarding':
                    html = renderOnboardingScreen();
                    break;
                case 'dashboard':
                    html = renderDashboardScreen();
                    break;
                case 'my_livestock':
                    html = renderMyLivestockScreen();
                    break;
                case 'add_animal':
                    html = renderAddAnimalScreen();
                    break;
                case 'animal_profile':
                    html = renderAnimalProfileScreen();
                    break;
                case 'health':
                    html = renderSubModuleScreen('Health & Medical Status', 'fa-heart-pulse', renderHealthContent());
                    break;
                case 'vaccination':
                    html = renderSubModuleScreen('Vaccination Schedule', 'fa-syringe', renderVaccinationContent());
                    break;
                case 'treatment':
                    html = renderSubModuleScreen('Medical Treatments', 'fa-capsules', renderTreatmentContent());
                    break;
                case 'breeding':
                    html = renderSubModuleScreen('Breeding & Calving', 'fa-venus-mars', renderBreedingContent());
                    break;
                case 'milk':
                    html = renderSubModuleScreen('Milk Production Analytics', 'fa-glass-water', renderMilkContent());
                    break;
                case 'feed':
                    html = renderSubModuleScreen('Feed & Nutrition Log', 'fa-wheat-awn', renderFeedContent());
                    break;
                case 'expenses':
                    html = renderSubModuleScreen('Expenses & Financials', 'fa-wallet', renderExpensesContent());
                    break;
                case 'history':
                    html = renderSubModuleScreen('Complete Animal History', 'fa-clock-rotate-left', renderHistoryContent());
                    break;
                case 'notifications':
                    html = renderNotificationsScreen();
                    break;
                case 'profile':
                    html = renderProfileScreen();
                    break;
                case 'settings':
                    html = renderSettingsScreen();
                    break;
                default:
                    html = renderDashboardScreen();
            }

            container.innerHTML = html;
        }

        function renderSplashScreen() {
            return `

                        <div class="w-24 h-24 bg-white/10 backdrop-blur-md rounded-3xl flex items-center justify-center text-fresh border border-fresh/30 shadow-2xl">

                        </div>
                        <div class="space-y-2">

                            <p class="text-earth/90 text-sm font-medium">Everything Farming. One App.</p>
                        </div>
                        <div class="pt-4 flex items-center space-x-2 text-xs text-earth/60">

        }

        function renderSignUpScreen() {

        function renderVerifyScreen() {
            return `

        function renderFeedContent() {

                        <div class="flex items-center space-x-3">
                            <button onclick="switchScreen('dashboard')" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white">
                                <i class="fa-solid fa-arrow-left"></i>

                        <button onclick="showToast('All notifications marked as read', 'success')" class="text-xs text-fresh font-semibold hover:underline">Mark all read</button>

                                        <span class="text-[10px] text-charcoal/40">${n.time}</span>

                    <div class="p-6 space-y-4">

                            <div>

                                <input type="text" value="${state.farmingType} Cattle Farming" class="w-full bg-offwhite border border-forest/20 rounded-xl px-3 py-2 text-charcoal">

                            <button onclick="showToast('Farm settings saved successfully!', 'success')" class="w-full bg-forest text-white py-2.5 rounded-xl font-bold mt-2">Save Changes</button>

                    </div>

                    ${renderBottomNav('profile')}
                </div>
            `;
        }

        function renderSignOutModal() {
            const modal = document.getElementById('modalContainer');
            modal.classList.remove('hidden');
            modal.innerHTML = `
                <div class="bg-white w-80 p-6 rounded-3xl shadow-2xl space-y-4 animate-fade-in text-center">

                        <i class="fa-solid fa-right-from-bracket"></i>
                    </div>
                    <div class="space-y-1">
                        <h3 class="font-bold text-base text-charcoal">Sign out of Hello Farmers?</h3>
                        <p class="text-xs text-charcoal/60">Your local records are safely secured.</p>
                    </div>
                    <div class="flex space-x-2 pt-2">
                        <button onclick="document.getElementById('modalContainer').classList.add('hidden')" class="flex-1 bg-offwhite hover:bg-forest/5 text-charcoal font-semibold py-3 rounded-xl text-xs">Cancel</button>
                        <button onclick="document.getElementById('modalContainer').classList.add('hidden'); switchScreen('landing'); showToast('Signed out successfully.', 'info');" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-xl text-xs">Sign Out</button>
                    </div>
                </div>
            `;
        }

            return `
                <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-forest/10 px-6 py-2.5 flex items-center justify-between text-[11px] shadow-lg z-30">

                        <span>Livestock</span>

                    <button onclick="switchScreen('profile')" class="flex flex-col items-center space-y-1 ${activeTab === 'profile' ? 'text-forest font-bold' : 'text-charcoal/50 hover:text-charcoal'}">
                        <i class="fa-solid fa-user text-base"></i>
                        <span>Profile</span>

            `;

        window.onload = function() {
            renderScreen();
